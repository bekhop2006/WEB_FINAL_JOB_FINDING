# Render — один сервис: backend + frontend
# Root Directory: оставьте пустым (repo root)
# Build: собирает frontend и backend
# Start: запускает backend, который отдаёт API + собранный frontend
services:
  - type: web
    name: jobfinder
    # rootDir: пусто = корень репозитория 
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Add these in Render Dashboard:
      # DATABASE_URL, JWT_SECRET, CORS_ORIGIN, SMTP_*

# Render — backend API only
# Root Directory: backend
services:
  - type: web
    name: jobfinder-api
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Add these in Render Dashboard:
      # DATABASE_URL, JWT_SECRET, CORS_ORIGIN, SMTP_*
